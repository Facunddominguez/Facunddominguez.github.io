name: Actualizar precios de INDEC

# Una vez por mes baja el archivo de precios promedio de INDEC. Si hay cambios, actualiza
# datos/precios.json, reconstruye la app y la vuelve a publicar. Si la descarga o la lectura
# fallan, no toca nada y queda el último archivo bueno.
# También se puede correr a mano desde la pestaña "Actions" de GitHub.
on:
  schedule:
    - cron: "23 6 20 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cambios: ${{ steps.guardar.outputs.cambios }}
    steps:
      - uses: actions/checkout@v5
      - name: Descargar el archivo de INDEC y regenerar los precios
        run: node herramientas/actualizar-precios.mjs
      - name: Comprobar los precios generados
        run: node herramientas/actualizar-precios.mjs --verificar
      - name: Reconstruir la app con los datos nuevos
        run: node herramientas/construir.mjs
      - id: guardar
        name: Guardar los cambios
        run: |
          if git diff --quiet -- datos/precios.json index.html; then
            echo "Sin cambios."
            echo "cambios=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/precios.json index.html
          git commit -m "Precios promedio actualizados con INDEC"
          git pull --rebase
          git push
          echo "cambios=si" >> "$GITHUB_OUTPUT"

  # Los cambios hechos por esta tarea no disparan otras tareas, por eso publica acá mismo.
  publicar:
    needs: actualizar
    if: needs.actualizar.outputs.cambios == 'si'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publicar.yml
