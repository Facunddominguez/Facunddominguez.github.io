name: Prueba de precios de INDEC

# Tarea de PRUEBA para los pull requests: baja el archivo real de INDEC, lo procesa, lo valida y sube el
# resultado como artifact. No commitea, no hace push y no publica nada: solo sirve para ver que la descarga
# y la lectura andan antes de que la tarea mensual (actualizar-precios.yml) corra en main.
# Si INDEC no responde (o cambió algo), la descarga queda como AVISO y no pone en rojo el pull request por algo ajeno
# al cambio; la verificación de los datos incluidos (sin red) sí es obligatoria.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Datos incluidos válidos (sin red)
        run: node herramientas/actualizar-precios.mjs --verificar
      - name: Descargar, procesar y validar lo de INDEC (sin tocar datos/precios.json)
        id: descarga
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/salida"
          node herramientas/actualizar-precios.mjs --salida "$RUNNER_TEMP/salida/precios-descargado.json"
          node herramientas/actualizar-precios.mjs --verificar --archivo-json "$RUNNER_TEMP/salida/precios-descargado.json"
          node -e "const d=require(process.argv[1]);console.log('mes '+d.mes+' · '+d.items.length+' ingredientes · GBA arroz '+d.items.find(i=>i.n==='Arroz').p.GBA)" "$RUNNER_TEMP/salida/precios-descargado.json" | tee "$RUNNER_TEMP/salida/resumen.txt"
      - name: Avisar si la descarga de INDEC falló
        if: steps.descarga.outcome == 'failure'
        run: echo "::warning title=Precios de INDEC::No se pudo descargar o validar el archivo de INDEC. Si INDEC está caído, reintentá más tarde; si cambió el formato, hay que revisar herramientas/actualizar-precios.mjs."
      - uses: actions/upload-artifact@v4
        if: steps.descarga.outcome == 'success'
        with:
          name: precios-descargado
          path: ${{ runner.temp }}/salida/
          retention-days: 14
