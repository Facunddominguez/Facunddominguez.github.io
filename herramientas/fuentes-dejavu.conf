<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Solo DejaVu (y Liberation/Noto si estuvieran): imita la tipografía del runner de GitHub. Uso:
     FONTCONFIG_FILE=$PWD/herramientas/fuentes-dejavu.conf node herramientas/probar.mjs -->
<fontconfig>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <dir>/usr/share/fonts/truetype/liberation</dir>
  <dir>/usr/share/fonts/truetype/noto</dir>
  <cachedir>/tmp/mpf-fontcache</cachedir>
  <alias><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
